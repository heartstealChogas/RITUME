<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가차 발주 시스템</title>
<style>
/* ── Reset & 기본 ── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#3182f6;--primary-light:#e8f1ff;--primary-dark:#1c64d6;
  --success:#05c46b;--warning:#ffa502;--danger:#ff4757;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;
  --gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;
  --radius-sm:8px;--radius:12px;--radius-lg:16px;--radius-xl:24px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow:0 4px 12px rgba(0,0,0,.1);
  --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
body{font-family:var(--font);background:var(--gray-50);color:var(--gray-800);min-height:100vh}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:var(--font);border:none;outline:none}
input,select{font-family:var(--font);outline:none}

/* ── 레이아웃 ── */
.app-shell{display:flex;flex-direction:column;min-height:100vh}

/* 헤더 */
.topbar{
  position:sticky;top:0;z-index:100;
  background:#fff;border-bottom:1px solid var(--gray-200);
  height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;box-shadow:var(--shadow-sm);
}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-logo .logo-icon{
  width:32px;height:32px;background:var(--primary);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;font-weight:700;letter-spacing:-1px;
}
.topbar-logo .logo-text{font-size:17px;font-weight:700;color:var(--gray-900)}
.topbar-logo .logo-sub{font-size:12px;color:var(--gray-400);margin-left:6px}
.topbar-actions{display:flex;align-items:center;gap:8px}

/* 사이드 네비 (데스크탑) */
.layout{display:flex;flex:1}
.sidenav{
  width:220px;min-height:calc(100vh - 56px);
  background:#fff;border-right:1px solid var(--gray-200);
  padding:16px 0;flex-shrink:0;
  position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;
}
.sidenav-section{padding:8px 16px 4px;font-size:11px;font-weight:600;color:var(--gray-400);letter-spacing:.5px;text-transform:uppercase}
.sidenav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 20px;font-size:14px;font-weight:500;color:var(--gray-600);
  border-radius:0;cursor:pointer;transition:all .15s;border-left:3px solid transparent;
}
.sidenav-item:hover{background:var(--gray-50);color:var(--gray-800)}
.sidenav-item.active{
  background:var(--primary-light);color:var(--primary);
  border-left-color:var(--primary);font-weight:600;
}
.sidenav-item .nav-icon{font-size:18px;width:22px;text-align:center}
.sidenav-store-group{padding:2px 0}
.sidenav-store-group-title{padding:6px 20px 2px 36px;font-size:10px;font-weight:700;color:var(--gray-400);letter-spacing:.4px}
.sidenav-store-item{padding:7px 16px 7px 36px;font-size:13px;color:var(--gray-600);cursor:pointer;transition:all .15s;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidenav-store-item:hover{background:var(--gray-50);color:var(--primary)}
.sidenav-store-item.active{color:var(--primary);font-weight:600;border-left-color:var(--primary);background:rgba(49,130,246,.06)}


/* 메인 컨텐츠 */
.main-content{flex:1;padding:16px;overflow:hidden}

/* 페이지 */
.page{display:none}
.page.active{display:block}

/* 페이지 헤더 */
.page-header{margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;color:var(--gray-900);margin-bottom:4px}
.page-sub{font-size:14px;color:var(--gray-500)}

/* ── 탭 (차수 선택) ── */
.tab-bar{
  display:flex;gap:4px;margin-bottom:24px;
  background:var(--gray-100);border-radius:var(--radius);padding:4px;
  overflow-x:auto;width:fit-content;
}
.tab-item{
  padding:8px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;
  color:var(--gray-500);background:transparent;transition:all .2s;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.tab-item:hover{color:var(--gray-700);background:rgba(0,0,0,.04)}
.tab-item.active{background:#fff;color:var(--primary);box-shadow:var(--shadow-sm)}
.tab-badge{
  background:var(--primary);color:#fff;border-radius:20px;
  font-size:11px;padding:1px 7px;font-weight:700;
}
.tab-item.active .tab-badge{background:var(--primary)}
.tab-item:not(.active) .tab-badge{background:var(--gray-300);color:var(--gray-600)}

/* ── 상품 그리드 ── */
.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(144px,1fr));
  gap:16px;
}
.product-card{
  background:#fff;border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);overflow:hidden;
  transition:all .2s;cursor:pointer;border:2px solid transparent;
}
.product-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.product-card.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(49,130,246,.15)}
.product-img{
  width:100%;aspect-ratio:1;object-fit:cover;background:var(--gray-100);
  display:block;
}
.product-img-placeholder{
  width:100%;aspect-ratio:1;background:var(--gray-100);
  display:flex;align-items:center;justify-content:center;font-size:32px;
}
.product-info{padding:10px 12px 12px}
.product-cha{
  font-size:9px;font-weight:600;color:var(--primary);
  background:var(--primary-light);border-radius:4px;
  padding:2px 6px;display:inline-block;margin-bottom:6px;
}
.product-name{font-size:9px;font-weight:600;color:var(--gray-800);line-height:1.4;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-code{font-size:9px;color:var(--gray-400);margin-bottom:6px}
.product-stock{display:flex;justify-content:space-between;align-items:center}
.stock-label{font-size:9px;color:var(--gray-500)}
.stock-value{font-size:9px;font-weight:700;color:var(--gray-700)}
.stock-value.low{color:var(--danger)}
.stock-value.ok{color:var(--success)}

/* ── 검색 / 필터 바 ── */
.toolbar{
  display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;
}
.search-box{
  position:relative;flex:1;min-width:200px;max-width:320px;
}
.search-box input{
  width:100%;height:40px;padding:0 12px 0 38px;
  border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  font-size:14px;color:var(--gray-800);background:#fff;transition:border .15s;
}
.search-box input:focus{border-color:var(--primary)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:16px}
.filter-select{
  height:40px;padding:0 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  font-size:14px;color:var(--gray-700);background:#fff;cursor:pointer;
}
.count-badge{
  font-size:13px;color:var(--gray-500);
  background:var(--gray-100);padding:6px 12px;border-radius:20px;
}

/* ── 버튼 ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;
  transition:all .15s;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:#fff;color:var(--gray-700);border:1.5px solid var(--gray-300)}
.btn-outline:hover{border-color:var(--gray-400);background:var(--gray-50)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center}

/* ── 차수 섹션 ── */
.chasu-section{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.chasu-section-header{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 14px;border-bottom:1.5px solid var(--gray-100);
  background:var(--gray-50);
}
.chasu-section-title{
  font-size:14px;font-weight:700;
  background:var(--primary-light);color:var(--primary);
  padding:3px 12px;border-radius:20px;
}
.chasu-section-store{font-size:14px;font-weight:700;color:var(--gray-800)}
.chasu-section-meta{font-size:12px;color:var(--gray-400)}
.chasu-section-body{padding:0;overflow-x:auto}


/* ── 모달 ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
  z-index:500;align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:#fff;border-radius:var(--radius-xl);padding:28px;
  width:90%;max-width:480px;box-shadow:var(--shadow-lg);
  max-height:90vh;overflow-y:auto;
}
.modal-title{font-size:18px;font-weight:700;margin-bottom:20px;color:var(--gray-900)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px}
.form-input{
  width:100%;height:44px;padding:0 14px;
  border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  font-size:14px;color:var(--gray-800);transition:border .15s;
}
.form-input:focus{border-color:var(--primary)}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ── 통계 카드 ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:#fff;border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm)}
.stat-label{font-size:13px;color:var(--gray-500);margin-bottom:8px}
.stat-value{font-size:28px;font-weight:700;color:var(--gray-900)}
.stat-sub{font-size:12px;color:var(--gray-400);margin-top:4px}
.stat-icon{font-size:24px;margin-bottom:8px}

/* ── 로딩 ── */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--gray-400);font-size:14px;gap:10px}
.spinner{width:20px;height:20px;border:2px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 토스트 ── */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--gray-900);color:#fff;padding:12px 18px;
  border-radius:var(--radius);font-size:14px;font-weight:500;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;
  animation:slideIn .3s ease;max-width:320px;
}
.toast.success{background:#1a7f45}
.toast.error{background:#c0392b}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── 반응형 ── */
@media(max-width:768px){
  .sidenav{display:none}
  .main-content{padding:16px}
  .product-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}

/* 하단 모바일 탭바 */
.mobile-tabbar{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid var(--gray-200);
  z-index:100;padding:4px 0 8px;
}
.mobile-tabbar-items{display:flex;justify-content:space-around}
.mobile-tab{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 16px;border-radius:var(--radius-sm);cursor:pointer;
  font-size:10px;color:var(--gray-500);transition:color .15s;
}
.mobile-tab .tab-icon{font-size:22px}
.mobile-tab.active{color:var(--primary)}
@media(max-width:768px){
  .mobile-tabbar{display:block}
  .main-content{padding-bottom:80px}
}
.section-label-input{
  border:none;background:transparent;font-size:14px;font-weight:700;
  color:var(--gray-800);width:110px;padding:0;cursor:text;
}
.section-label-input:focus{outline:none;border-bottom:2px solid var(--primary)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="app-shell">

<!-- 상단 바 -->
<header class="topbar">
  <div class="topbar-logo">
    <div class="logo-icon">가</div>
    <div>
      <span class="logo-text">가차 발주 시스템</span>
      <span class="logo-sub">GACHA ORDER</span>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-outline btn-sm" onclick="openStoreModal()">＋ 매장 추가</button>
  </div>
</header>

<div class="layout">
  <!-- 사이드 네비 -->
  <nav class="sidenav">
    <div class="sidenav-section">메뉴</div>
    <div class="sidenav-section">상품</div>
    <div class="sidenav-item active" data-page="products" onclick="navTo('products',this)">
      <span class="nav-icon">📦</span> 상품 목록
    </div>
  </nav>

  <!-- 메인 -->
  <main class="main-content">

    <!-- ★ 상품 목록 -->
    <div id="page-products" class="page active">
      <div class="page-header">
        <div class="page-title">상품 목록</div>
        <div class="page-sub" id="product-count-sub"></div>
      </div>
      <div class="tab-bar" id="cha-su-tabs"></div>
      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="상품명·코드 검색" id="product-search" oninput="filterProducts()">
        </div>
        <select class="filter-select" id="stock-filter" onchange="filterProducts()">
          <option value="">재고 전체</option>
          <option value="ok">재고 있음</option>
          <option value="low">재고 없음</option>
        </select>
        <span class="count-badge" id="product-count-badge"></span>
      </div>
      <div class="product-grid" id="product-grid">
        <div class="loading"><div class="spinner"></div>로딩 중...</div>
      </div>
    </div>

    <!-- ★ 재고 현황 -->
    <div id="page-stock" class="page" style="display:none!important">
      <div class="page-header">
        <div class="page-title">재고 현황</div>
        <div class="page-sub">발주 완료 처리 시 자동 반영됩니다 · 추후 출고 수량 입력 지원 예정</div>
      </div>

      <!-- 매장 요약 카드 -->
      <div class="stats-grid" id="stock-summary-grid" style="margin-bottom:28px"></div>

      <!-- 필터 -->
      <div class="toolbar">
        <select class="filter-select" id="stock-store-filter" onchange="loadStockDetail()">
          <option value="">매장 선택</option>
        </select>
        <select class="filter-select" id="stock-chasu-filter" onchange="loadStockDetail()">
          <option value="">전체 차수</option>
        </select>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="상품명·코드 검색" id="stock-search" oninput="filterStockTable()">
        </div>
        <span class="count-badge" id="stock-count-badge"></span>
      </div>

      <!-- 재고 테이블 -->
      <div style="background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden">
        <table style="width:100%;border-collapse:collapse;font-size:13px" id="stock-table">
          <thead>
            <tr style="background:var(--gray-50);border-bottom:2px solid var(--gray-200)">
              <th style="padding:12px 16px;text-align:left;font-weight:600;color:var(--gray-600)">차수</th>
              <th style="padding:12px 16px;text-align:left;font-weight:600;color:var(--gray-600)">상품명</th>
              <th style="padding:12px 16px;text-align:left;font-weight:600;color:var(--gray-600)">코드</th>
              <th style="padding:12px 16px;text-align:right;font-weight:600;color:var(--gray-600)">입고 수량</th>
              <th style="padding:12px 16px;text-align:right;font-weight:600;color:var(--gray-600)">출고 수량</th>
              <th style="padding:12px 16px;text-align:right;font-weight:600;color:var(--gray-600)">잔여 재고</th>
            </tr>
          </thead>
          <tbody id="stock-tbody">
            <tr><td colspan="6" style="padding:60px;text-align:center;color:var(--gray-400)">매장을 선택하세요</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div><!-- /layout -->

<!-- 모바일 탭바 -->
<div class="mobile-tabbar">
  <div class="mobile-tabbar-items">
    <div class="mobile-tab active" data-page="products" onclick="mobileNav('products',this)">
      <span class="tab-icon">📦</span>상품
    </div>
  </div>
</div>

<!-- 매장 추가 모달 -->
<div class="modal-overlay" id="store-modal">
  <div class="modal">
    <div class="modal-title">매장 추가</div>
    <div class="form-group">
      <label class="form-label">매장명</label>
      <input type="text" class="form-input" id="new-store-name" placeholder="예: 강남점">
    </div>
    <div class="form-group">
      <label class="form-label">PIN (4자리)</label>
      <input type="text" class="form-input" id="new-store-pin" placeholder="0000" maxlength="4">
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeStoreModal()">취소</button>
      <button class="btn btn-primary" onclick="addStore()">추가</button>
    </div>
  </div>
</div>


<!-- 관리자 PIN 모달 -->
<div class="modal-overlay" id="pin-modal">
  <div class="modal" style="max-width:320px;text-align:center">
    <div style="font-size:28px;margin-bottom:12px">🔒</div>
    <div class="modal-title" style="margin-bottom:8px">관리자 확인</div>
    <div style="font-size:13px;color:var(--gray-500);margin-bottom:20px" id="pin-modal-desc">배치를 수정하려면 비밀번호를 입력하세요</div>
    <input type="password" class="form-input" id="pin-input" placeholder="비밀번호"
      maxlength="10" style="text-align:center;font-size:20px;letter-spacing:6px"
      onkeydown="if(event.key==='Enter')confirmPin()">
    <div id="pin-error" style="color:var(--danger);font-size:13px;margin-top:8px;min-height:20px"></div>
    <div class="form-actions" style="margin-top:16px;justify-content:center">
      <button class="btn btn-outline" onclick="closePinModal()">취소</button>
      <button class="btn btn-primary" onclick="confirmPin()">확인</button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div id="toast-container"></div>

<script>
// ═══════════════════════════════════════════
// 전역 상태
// ═══════════════════════════════════════════
const API = '';
let allProducts = [];
let allStores = [];
let chasuList = [];
let currentChasuFilter = 0; // 0=전체

// ── 관리자 인증 (세션 유지)
let _pinAuthed = sessionStorage.getItem('pin_authed') === '1';
let _pinCallback = null;

async function requirePin(callback, desc = '배치를 수정하려면 비밀번호를 입력하세요') {
  if (_pinAuthed) { callback(); return; }
  _pinCallback = callback;
  document.getElementById('pin-modal-desc').textContent = desc;
  document.getElementById('pin-input').value = '';
  document.getElementById('pin-error').textContent = '';
  document.getElementById('pin-modal').classList.add('open');
  setTimeout(() => document.getElementById('pin-input').focus(), 100);
}

async function confirmPin() {
  const pin = document.getElementById('pin-input').value;
  const res = await fetch(API + '/api/auth/verify', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin })
  });
  if (res.ok) {
    _pinAuthed = true;
    sessionStorage.setItem('pin_authed', '1');
    closePinModal();
    if (_pinCallback) { _pinCallback(); _pinCallback = null; }
  } else {
    document.getElementById('pin-error').textContent = '비밀번호가 틀렸습니다';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-input').focus();
  }
}

function closePinModal() {
  document.getElementById('pin-modal').classList.remove('open');
  _pinCallback = null;
}

// ═══════════════════════════════════════════
// 초기화
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  await Promise.all([loadStores(), loadChasuList(), loadProducts()]);
});

// ═══════════════════════════════════════════
// 네비게이션
// ═══════════════════════════════════════════
function navTo(page, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.sidenav-item').forEach(i => i.classList.remove('active'));
  const pageEl = document.getElementById('page-' + page);
  if (pageEl) { pageEl.style.removeProperty('display'); pageEl.classList.add('active'); }
  el.classList.add('active');
}
function mobileNav(page, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.mobile-tab').forEach(i => i.classList.remove('active'));
  document.querySelectorAll('.sidenav-item').forEach(i => {
    if (i.dataset.page === page) i.classList.add('active');
    else i.classList.remove('active');
  });
  const pageEl = document.getElementById('page-' + page);
  if (pageEl) { pageEl.style.removeProperty('display'); pageEl.classList.add('active'); }
  el.classList.add('active');
}

// ═══════════════════════════════════════════
// 데이터 로드
// ═══════════════════════════════════════════
async function loadStores() {
  const res = await fetch(API + '/api/stores');
  allStores = await res.json();
}

async function loadChasuList() {
  const res = await fetch(API + '/api/products/cha-su-list');
  chasuList = await res.json();
}
async function loadProducts() {
  const res = await fetch(API + '/api/products');
  allProducts = await res.json();
  renderChasuTabs();
  renderProducts();
}

// ═══════════════════════════════════════════
// 대시보드
// ═══════════════════════════════════════════
async function renderDashboard() {
  const statsEl = document.getElementById('stats-grid');
  const totalProducts = allProducts.length;
  const totalStores = allStores.length;
  const chasuCount = chasuList.length;
  const totalStock = allProducts.reduce((s, p) => s + (p.stock_avail || 0), 0);

  statsEl.innerHTML = `
    <div class="stat-card">
      <div class="stat-icon">📦</div>
      <div class="stat-label">전체 상품</div>
      <div class="stat-value">${totalProducts}<span style="font-size:16px;font-weight:400;color:var(--gray-400)">개</span></div>
      <div class="stat-sub">차수 ${chasuList.map(c=>c.cha_su+'차').join(', ')}</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🏪</div>
      <div class="stat-label">등록 매장</div>
      <div class="stat-value">${totalStores}<span style="font-size:16px;font-weight:400;color:var(--gray-400)">개</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📊</div>
      <div class="stat-label">총 가용재고</div>
      <div class="stat-value">${totalStock.toLocaleString()}<span style="font-size:14px;font-weight:400;color:var(--gray-400)">개</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔢</div>
      <div class="stat-label">차수 종류</div>
      <div class="stat-value">${chasuCount}<span style="font-size:16px;font-weight:400;color:var(--gray-400)">종</span></div>
    </div>
  `;
}

// ═══════════════════════════════════════════
// 상품 목록
// ═══════════════════════════════════════════
function renderChasuTabs() {
  const el = document.getElementById('cha-su-tabs');
  const total = allProducts.length;
  let html = `<div class="tab-item active" data-chasu="0" onclick="selectChasuTab(0,this)">전체 <span class="tab-badge">${total}</span></div>`;
  for (const c of chasuList) {
    html += `<div class="tab-item" data-chasu="${c.cha_su}" onclick="selectChasuTab(${c.cha_su},this)">${c.cha_su}차 <span class="tab-badge">${c.cnt}</span></div>`;
  }
  el.innerHTML = html;
}
function selectChasuTab(chasu, el) {
  currentChasuFilter = chasu;
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  filterProducts();
}
function filterProducts() {
  const search = document.getElementById('product-search').value.toLowerCase();
  const stockFilter = document.getElementById('stock-filter').value;
  let filtered = allProducts;
  if (currentChasuFilter) filtered = filtered.filter(p => p.cha_su === currentChasuFilter);
  if (search) filtered = filtered.filter(p =>
    p.name.toLowerCase().includes(search) || p.code.includes(search)
  );
  if (stockFilter === 'ok') filtered = filtered.filter(p => p.stock_avail > 0);
  if (stockFilter === 'low') filtered = filtered.filter(p => p.stock_avail === 0);
  document.getElementById('product-count-badge').textContent = `${filtered.length}개`;
  renderProducts(filtered);
}
function renderProducts(products) {
  if (!products) products = allProducts;
  const grid = document.getElementById('product-grid');
  document.getElementById('product-count-sub').textContent = `총 ${allProducts.length}개 상품`;
  document.getElementById('product-count-badge').textContent = `${products.length}개`;
  if (products.length === 0) {
    grid.innerHTML = '<div style="color:var(--gray-400);font-size:14px;padding:40px;grid-column:1/-1">검색 결과가 없습니다</div>';
    return;
  }
  grid.innerHTML = products.map(p => `
    <div class="product-card" onclick="showProductDetail(${p.id})">
      ${p.image_path
        ? `<img class="product-img" src="/${p.image_path}" loading="lazy" alt="${p.name}">`
        : `<div class="product-img-placeholder">📦</div>`}
      <div class="product-info">
        <div class="product-cha">${p.cha_su}차 <span style="color:var(--gray-400);font-weight:400">No.${p.seq ?? '-'}</span></div>
        <div class="product-name">${p.name}</div>
        <div class="product-code">${p.code}</div>

      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════
// 매장 모달
// ═══════════════════════════════════════════
function openStoreModal() { document.getElementById('store-modal').classList.add('open') }
function closeStoreModal() { document.getElementById('store-modal').classList.remove('open') }
async function addStore() {
  const name = document.getElementById('new-store-name').value.trim();
  const pin = document.getElementById('new-store-pin').value || '0000';
  if (!name) { toast('매장명을 입력하세요', 'error'); return; }
  const res = await fetch(API + '/api/stores', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, pin})
  });
  if (res.ok) {
    toast('매장이 추가되었습니다', 'success');
    closeStoreModal();
    document.getElementById('new-store-name').value = '';
    document.getElementById('new-store-pin').value = '';
    await loadStores();
  } else {
    const d = await res.json();
    toast(d.detail || '오류가 발생했습니다', 'error');
  }
}

// ═══════════════════════════════════════════
// 유틸
// ═══════════════════════════════════════════
function toast(msg, type = '') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type==='success'?'✓ ':type==='error'?'✕ ':'') + msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function showProductDetail(id) {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  alert(`[${p.cha_su}차 ${p.seq}번]\n${p.name}\n코드: ${p.code}\n총재고: ${p.stock_total}\n가용재고: ${p.stock_avail}`);
}

// ═══════════════════════════════════════════
// 재고 현황
// ═══════════════════════════════════════════
let stockData = [];

function initStockFilters() {
  const storeEl = document.getElementById('stock-store-filter');
  storeEl.innerHTML = '<option value="">매장 선택</option>' +
    allStores.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  const chasuEl = document.getElementById('stock-chasu-filter');
  chasuEl.innerHTML = '<option value="">전체 차수</option>' +
    chasuList.map(c => `<option value="${c.cha_su}">${c.cha_su}차</option>`).join('');
}

async function loadStockSummary() {
  const res = await fetch(API + '/api/stock/summary/all');
  const data = await res.json();
  const grid = document.getElementById('stock-summary-grid');
  if (!data.length) { grid.innerHTML = ''; return; }
  grid.innerHTML = data.map(s => `
    <div class="stat-card" style="cursor:pointer" onclick="quickSelectStore(${s.store_id})">
      <div class="stat-icon">🏪</div>
      <div class="stat-label">${s.store_name}</div>
      <div class="stat-value">${(s.total_remaining || 0).toLocaleString()}<span style="font-size:14px;font-weight:400;color:var(--gray-400)">개</span></div>
      <div class="stat-sub">상품 ${s.product_count}종</div>
    </div>
  `).join('');
}

function quickSelectStore(storeId) {
  document.getElementById('stock-store-filter').value = storeId;
  loadStockDetail();
}

async function loadStockDetail() {
  const storeId = document.getElementById('stock-store-filter').value;
  const chasu = document.getElementById('stock-chasu-filter').value;
  const tbody = document.getElementById('stock-tbody');

  if (!storeId) {
    tbody.innerHTML = '<tr><td colspan="6" style="padding:60px;text-align:center;color:var(--gray-400)">매장을 선택하세요</td></tr>';
    stockData = [];
    document.getElementById('stock-count-badge').textContent = '';
    return;
  }

  tbody.innerHTML = '<tr><td colspan="6" style="padding:40px;text-align:center"><div style="display:inline-flex;gap:8px;align-items:center;color:var(--gray-400)"><div class="spinner"></div>로딩 중...</div></td></tr>';

  let url = API + `/api/stock/${storeId}`;
  if (chasu) url += `?cha_su=${chasu}`;
  const res = await fetch(url);
  stockData = await res.json();
  filterStockTable();
}

function filterStockTable() {
  const q = document.getElementById('stock-search').value.toLowerCase();
  const filtered = q
    ? stockData.filter(r => r.name.toLowerCase().includes(q) || (r.code || '').includes(q))
    : stockData;

  document.getElementById('stock-count-badge').textContent = `${filtered.length}개 상품`;
  const tbody = document.getElementById('stock-tbody');

  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="padding:60px;text-align:center;color:var(--gray-400)">데이터가 없습니다</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(r => {
    const remaining = r.qty_remaining;
    const remColor = remaining <= 0 ? 'var(--danger)' : remaining <= 5 ? 'var(--warning)' : 'var(--success)';
    return `
      <tr style="border-bottom:1px solid var(--gray-100);transition:background .1s" onmouseover="this.style.background='var(--gray-50)'" onmouseout="this.style.background=''">
        <td style="padding:12px 16px"><span class="product-cha">${r.cha_su}차</span></td>
        <td style="padding:12px 16px;font-weight:500;color:var(--gray-800)">${r.name}</td>
        <td style="padding:12px 16px;color:var(--gray-400);font-size:12px">${r.code || '-'}</td>
        <td style="padding:12px 16px;text-align:right;color:var(--gray-700)">${r.qty_in.toLocaleString()}</td>
        <td style="padding:12px 16px;text-align:right;color:var(--gray-500)">${r.qty_out.toLocaleString()}</td>
        <td style="padding:12px 16px;text-align:right;font-weight:700;color:${remColor}">${remaining.toLocaleString()}</td>
      </tr>
    `;
  }).join('');
}

// 모달 외부 클릭 닫기
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});
</script>
</body>
</html>
