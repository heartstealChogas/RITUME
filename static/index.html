<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가차 상품 목록</title>
<style>
/* ── Reset & 기본 ── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#3182f6;--primary-light:#e8f1ff;--primary-dark:#1c64d6;
  --success:#05c46b;--warning:#ffa502;--danger:#ff4757;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;
  --gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;
  --radius-sm:8px;--radius:12px;--radius-lg:16px;--radius-xl:24px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow:0 4px 12px rgba(0,0,0,.1);
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
body{font-family:var(--font);background:var(--gray-50);color:var(--gray-800);min-height:100vh}
button{cursor:pointer;font-family:var(--font);border:none;outline:none}
input,select{font-family:var(--font);outline:none}

/* ── 레이아웃 ── */
.app-shell{display:flex;flex-direction:column;min-height:100vh}

/* 헤더 */
.topbar{
  position:sticky;top:0;z-index:100;
  background:#fff;border-bottom:1px solid var(--gray-200);
  height:56px;display:flex;align-items:center;
  padding:0 20px;box-shadow:var(--shadow-sm);
}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-logo .logo-icon{
  width:32px;height:32px;background:var(--primary);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;font-weight:700;letter-spacing:-1px;
}
.topbar-logo .logo-text{font-size:17px;font-weight:700;color:var(--gray-900)}
.topbar-logo .logo-sub{font-size:12px;color:var(--gray-400);margin-left:6px}

/* 메인 컨텐츠 */
.main-content{flex:1;padding:16px}

/* 페이지 헤더 */
.page-header{margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;color:var(--gray-900);margin-bottom:4px}
.page-sub{font-size:14px;color:var(--gray-500)}

/* ── 탭 (차수 선택) ── */
.tab-bar{
  display:flex;gap:4px;margin-bottom:24px;
  background:var(--gray-100);border-radius:var(--radius);padding:4px;
  overflow-x:auto;width:fit-content;
}
.tab-item{
  padding:8px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;
  color:var(--gray-500);background:transparent;transition:all .2s;white-space:nowrap;
  display:flex;align-items:center;gap:6px;cursor:pointer;
}
.tab-item:hover{color:var(--gray-700);background:rgba(0,0,0,.04)}
.tab-item.active{background:#fff;color:var(--primary);box-shadow:var(--shadow-sm)}
.tab-badge{
  background:var(--primary);color:#fff;border-radius:20px;
  font-size:11px;padding:1px 7px;font-weight:700;
}
.tab-item.active .tab-badge{background:var(--primary)}
.tab-item:not(.active) .tab-badge{background:var(--gray-300);color:var(--gray-600)}

/* ── 상품 그리드 ── */
.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(144px,1fr));
  gap:16px;
}
.product-card{
  background:#fff;border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);overflow:hidden;
  transition:all .2s;cursor:pointer;border:2px solid transparent;
}
.product-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.product-img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--gray-100);display:block;}
.product-img-placeholder{
  width:100%;aspect-ratio:1;background:var(--gray-100);
  display:flex;align-items:center;justify-content:center;font-size:32px;
}
.product-info{padding:10px 12px 12px}
.product-cha{
  font-size:9px;font-weight:600;color:var(--primary);
  background:var(--primary-light);border-radius:4px;
  padding:2px 6px;display:inline-block;margin-bottom:6px;
}
.product-name{font-size:9px;font-weight:600;color:var(--gray-800);line-height:1.4;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-code{font-size:9px;color:var(--gray-400)}

/* ── 검색 / 필터 바 ── */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.search-box{position:relative;flex:1;min-width:200px;max-width:320px;}
.search-box input{
  width:100%;height:40px;padding:0 12px 0 38px;
  border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  font-size:14px;color:var(--gray-800);background:#fff;transition:border .15s;
}
.search-box input:focus{border-color:var(--primary)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:16px}
.filter-select{
  height:40px;padding:0 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  font-size:14px;color:var(--gray-700);background:#fff;cursor:pointer;
}
.count-badge{font-size:13px;color:var(--gray-500);background:var(--gray-100);padding:6px 12px;border-radius:20px;}

/* ── 로딩 ── */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--gray-400);font-size:14px;gap:10px}
.spinner{width:20px;height:20px;border:2px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 토스트 ── */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--gray-900);color:#fff;padding:12px 18px;
  border-radius:var(--radius);font-size:14px;font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,.12);display:flex;align-items:center;gap:8px;
  animation:slideIn .3s ease;max-width:320px;
}
.toast.success{background:#1a7f45}
.toast.error{background:#c0392b}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── 반응형 ── */
@media(max-width:768px){
  .product-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
}
</style>
</head>
<body>
<div class="app-shell">

<!-- 상단 바 -->
<header class="topbar">
  <div class="topbar-logo">
    <div class="logo-icon">가</div>
    <div>
      <span class="logo-text">가차 상품 목록</span>
      <span class="logo-sub">GACHA PRODUCTS</span>
    </div>
  </div>
</header>

<!-- 메인 -->
<main class="main-content">
  <div class="page-header">
    <div class="page-title">상품 목록</div>
    <div class="page-sub" id="product-count-sub"></div>
  </div>
  <div class="tab-bar" id="cha-su-tabs"></div>
  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="상품명·코드 검색" id="product-search" oninput="filterProducts()">
    </div>
    <select class="filter-select" id="stock-filter" onchange="filterProducts()">
      <option value="">재고 전체</option>
      <option value="ok">재고 있음</option>
      <option value="low">재고 없음</option>
    </select>
    <span class="count-badge" id="product-count-badge"></span>
  </div>
  <div class="product-grid" id="product-grid">
    <div class="loading"><div class="spinner"></div>로딩 중...</div>
  </div>
</main>

<!-- 토스트 -->
<div id="toast-container"></div>

<script>
const API = '';
let allProducts = [];
let chasuList = [];
let currentChasuFilter = 0;

document.addEventListener('DOMContentLoaded', async () => {
  await Promise.all([loadChasuList(), loadProducts()]);
});

async function loadChasuList() {
  const res = await fetch(API + '/api/products/cha-su-list');
  chasuList = await res.json();
}

async function loadProducts() {
  const res = await fetch(API + '/api/products');
  allProducts = await res.json();
  renderChasuTabs();
  renderProducts();
}

function renderChasuTabs() {
  const el = document.getElementById('cha-su-tabs');
  const total = allProducts.length;
  let html = `<div class="tab-item active" data-chasu="0" onclick="selectChasuTab(0,this)">전체 <span class="tab-badge">${total}</span></div>`;
  for (const c of chasuList) {
    html += `<div class="tab-item" data-chasu="${c.cha_su}" onclick="selectChasuTab(${c.cha_su},this)">${c.cha_su}차 <span class="tab-badge">${c.cnt}</span></div>`;
  }
  el.innerHTML = html;
}

function selectChasuTab(chasu, el) {
  currentChasuFilter = chasu;
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  filterProducts();
}

function filterProducts() {
  const search = document.getElementById('product-search').value.toLowerCase();
  const stockFilter = document.getElementById('stock-filter').value;
  let filtered = allProducts;
  if (currentChasuFilter) filtered = filtered.filter(p => p.cha_su === currentChasuFilter);
  if (search) filtered = filtered.filter(p =>
    p.name.toLowerCase().includes(search) || p.code.includes(search)
  );
  if (stockFilter === 'ok') filtered = filtered.filter(p => p.stock_avail > 0);
  if (stockFilter === 'low') filtered = filtered.filter(p => p.stock_avail === 0);
  document.getElementById('product-count-badge').textContent = `${filtered.length}개`;
  renderProducts(filtered);
}

function renderProducts(products) {
  if (!products) products = allProducts;
  const grid = document.getElementById('product-grid');
  document.getElementById('product-count-sub').textContent = `총 ${allProducts.length}개 상품`;
  document.getElementById('product-count-badge').textContent = `${products.length}개`;
  if (products.length === 0) {
    grid.innerHTML = '<div style="color:var(--gray-400);font-size:14px;padding:40px;grid-column:1/-1">검색 결과가 없습니다</div>';
    return;
  }
  grid.innerHTML = products.map(p => `
    <div class="product-card" onclick="showProductDetail(${p.id})">
      ${p.image_path
        ? `<img class="product-img" src="/${p.image_path}" loading="lazy" alt="${p.name}">`
        : `<div class="product-img-placeholder">📦</div>`}
      <div class="product-info">
        <div class="product-cha">${p.cha_su}차 <span style="color:var(--gray-400);font-weight:400">No.${p.seq ?? '-'}</span></div>
        <div class="product-name">${p.name}</div>
        <div class="product-code">${p.code}</div>
      </div>
    </div>
  `).join('');
}

function showProductDetail(id) {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  alert(`[${p.cha_su}차 ${p.seq}번]\n${p.name}\n코드: ${p.code}\n총재고: ${p.stock_total}\n가용재고: ${p.stock_avail}`);
}

function toast(msg, type = '') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type==='success'?'✓ ':type==='error'?'✕ ':'') + msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
</script>
</body>
</html>
